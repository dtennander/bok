[package]
name = "bok"
version = "0.2.0"
edition = "2024"
description = "A git-inspired command-line tool for local accounting."
license = "MIT"
repository = "https://github.com/dtennander/bok"
homepage = "https://github.com/dtennander/bok"
documentation = "https://docs.rs/bok"
readme = "README.md"
keywords = ["ledger", "finance", "cli", "accounting"]
categories = ["command-line-utilities", "finance"]

[dependencies]
calamine = "0.32.0"
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4.5"
flate2 = "1.1.2"
hex = "0.4.3"
reqwest = { version = "0.13.1", features = ["blocking"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
anyhow = "1.0"

[dev-dependencies]
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
